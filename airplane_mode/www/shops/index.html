<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Shops</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <main class="container">
        <h1>Shops</h1>

        {% if shops %}
            {% for shop in shops %}
            <article>
                <header>
                    <h3>{{ shop.shop_name }}</h3>
                </header>

                <p><strong>Document Name:</strong> {{ shop.name }}</p>
                <p><strong>Shop Number:</strong> {{ shop.shop_number }}</p>
                <p><strong>Airport:</strong> {{ shop.airport }}</p>
                <p><strong>Status:</strong> {{ shop.status }}</p>

                <a href="/shops/shop-detail?shop={{ shop.name }}">View details</a>
            </article>
            {% endfor %}
        {% else %}
            <p>No shops found.</p>
        {% endif %}
    </main>
</body>
</html>
